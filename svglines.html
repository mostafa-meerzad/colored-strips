<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <svg width="100%" height="100%" viewBox="0 0 800 600" id="svg">
      <line
        x1="100"
        y1="200"
        x2="700"
        y2="400"
        stroke="cyan"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.6"
      />
      <circle cx="100" cy="200" r="5" fill="cyan" id="dot" />
    </svg>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
      gsap.to("#dot", {
        motionPath: {
          path: "line",
          align: "line",
          autoRotate: false,
        },
        repeat: -1,
        duration: 2,
        ease: "power1.inOut",
      });
    </script>
  </body>
</html>
