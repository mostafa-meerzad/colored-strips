<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Glowing Line with Moving Dot</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Create scene, camera, and renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Create a glowing line
        const material = new THREE.LineBasicMaterial({ color: 0x00ffff });
        const points = [new THREE.Vector3(-2, 0, 0), new THREE.Vector3(2, 1, 0)];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, material);
        scene.add(line);

        // Create a glowing moving dot
        const dotGeometry = new THREE.SphereGeometry(0.05, 32, 32);
        const dotMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const dot = new THREE.Mesh(dotGeometry, dotMaterial);
        scene.add(dot);

        camera.position.z = 5;

        let progress = 0;

        function animate() {
            requestAnimationFrame(animate);

            // Move the dot along the line
            progress += 0.01;
            if (progress > 1) progress = 0;

            dot.position.lerpVectors(points[0], points[1], progress);
            renderer.render(scene, camera);
        }

        animate();

        // Resize event to make canvas responsive
        window.addEventListener("resize", () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

    </script>
</body>
</html>
